name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
          # Pinned to the version the code was verified on. An unpinned "stable" resolved to
          # 3.50.1 on the first run, where package:flutter/material.dart is deprecated in
          # favour of material_ui, and "flutter analyze --fatal-infos" failed with no code
          # change. Bump this deliberately, together with any resulting migration.

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Unit tests for the exception types and the string/date extensions. Note that
      # "flutter test" exits non-zero when there is no test/ directory at all.
      - name: Run tests
        run: flutter test

      # The runner image provides the Android SDK and a JDK; flutter-action does not.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
