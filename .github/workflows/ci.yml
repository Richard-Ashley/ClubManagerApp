name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # No flutter-version pin: deliberate. The repo tracks the latest stable Flutter
          # release, so a new Flutter release can change CI results without a code change.
          # Pin a version here if reproducibility becomes more important than freshness.

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # Unit tests for the exception types and the string/date extensions. Note that
      # "flutter test" exits non-zero when there is no test/ directory at all.
      - name: Run tests
        run: flutter test

      # The runner image provides the Android SDK and a JDK; flutter-action does not.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
